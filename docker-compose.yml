services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./apps/api
    container_name: backend
    env_file:
      - .env
    volumes:
      - ./apps/api/src:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
